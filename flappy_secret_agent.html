<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Secret Agent Flight</title>

<style>

body{
    margin:0;
    background:#02020b;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    text-shadow:0 0 20px cyan;
}

canvas{
    border:3px solid cyan;
    border-radius:15px;
    box-shadow:0 0 30px cyan;
}

button{
    margin-top:15px;
    padding:12px 25px;
    background:#003366;
    color:white;
    border:2px solid cyan;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>✈️ Secret Agent Flight</h1>

<p>SPACE eller klick = flyg</p>

<canvas id="game" width="400" height="600"></canvas>

<br>

<button onclick="restart()">🔄 Starta om</button>


<script>

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");


let plane;
let pipes=[];
let score;
let gameOver;
let explosion=[];



function start(){

plane={
x:80,
y:300,
velocity:0
};

pipes=[];

score=0;

gameOver=false;

explosion=[];

}



function fly(){

if(!gameOver){

plane.velocity=-7;

}

}



document.addEventListener("keydown",function(e){

if(e.code=="Space"){

fly();

}

});


canvas.onclick=fly;



// 🌃 STILLASTÅENDE NATTSTAD

function drawNightCity(){


// himmel

ctx.fillStyle="#03031a";

ctx.fillRect(
0,
0,
400,
600
);


// måne

ctx.fillStyle="#ffffcc";

ctx.beginPath();

ctx.arc(
330,
80,
35,
0,
Math.PI*2
);

ctx.fill();


// stjärnor

ctx.fillStyle="white";


let stars=[
[40,80],
[120,120],
[220,60],
[280,150],
[370,100],
[70,200],
[180,180]
];


stars.forEach(s=>{

ctx.fillRect(
s[0],
s[1],
3,
3
);

});



// hus

let city=[
80,140,100,180,120,90,160,110,200
];


ctx.fillStyle="#09092b";


for(let i=0;i<city.length;i++){

ctx.fillRect(

i*45,

600-city[i],

40,

city[i]

);

}


// neonfönster

ctx.fillStyle="#00ffff";


for(let x=0;x<400;x+=45){

for(let y=430;y<580;y+=35){

ctx.fillRect(

x+10,

y,

8,

8

);

}

}


}





// ✈️ AGENTFLYGPLAN

function drawPlane(){


ctx.fillStyle="#003366";


ctx.beginPath();

ctx.moveTo(
plane.x,
plane.y
);

ctx.lineTo(
plane.x+45,
plane.y-12
);

ctx.lineTo(
plane.x+65,
plane.y
);

ctx.lineTo(
plane.x+45,
plane.y+12
);

ctx.closePath();

ctx.fill();



// vingar

ctx.fillStyle="#001f4d";


ctx.beginPath();

ctx.moveTo(
plane.x+30,
plane.y
);

ctx.lineTo(
plane.x+5,
plane.y+25
);

ctx.lineTo(
plane.x+45,
plane.y+10
);

ctx.fill();



ctx.beginPath();

ctx.moveTo(
plane.x+30,
plane.y
);

ctx.lineTo(
plane.x+5,
plane.y-25
);

ctx.lineTo(
plane.x+45,
plane.y-10
);

ctx.fill();



// cockpit

ctx.fillStyle="#00ffff";

ctx.beginPath();

ctx.arc(
plane.x+45,
plane.y-4,
7,
0,
Math.PI*2
);

ctx.fill();


}



// HINDER

function createPipe(){

let gap=170;

let top=Math.random()*220+80;


pipes.push({

x:400,

top:top,

bottom:top+gap

});

}



// EXPLOSION

function createExplosion(){

explosion=[];


for(let i=0;i<50;i++){

explosion.push({

x:plane.x+30,

y:plane.y,

dx:(Math.random()-0.5)*10,

dy:(Math.random()-0.5)*10,

size:Math.random()*10+3

});

}

}



function drawExplosion(){


explosion.forEach(p=>{


p.x+=p.dx;

p.y+=p.dy;

p.size*=0.96;


ctx.fillStyle="orange";

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size/2,
0,
Math.PI*2
);

ctx.fill();


});

}




function update(){


if(gameOver){

drawNightCity();

drawExplosion();

return;

}



drawNightCity();



plane.velocity+=0.4;

plane.y+=plane.velocity;



drawPlane();



if(
pipes.length==0 ||
pipes[pipes.length-1].x<220
){

createPipe();

}



pipes.forEach(p=>{


p.x-=3;


ctx.fillStyle="#5500aa";


ctx.fillRect(
p.x,
0,
50,
p.top
);


ctx.fillRect(
p.x,
p.bottom,
50,
600
);



if(

plane.x+50>p.x &&
plane.x<p.x+50 &&
(
plane.y-15<p.top ||
plane.y+15>p.bottom
)

){

die();

}



});



if(
plane.y<0 ||
plane.y>600
){

die();

}



ctx.fillStyle="white";

ctx.font="25px Arial";

ctx.fillText(
"Uppdrag: "+score,
20,
40
);



requestAnimationFrame(update);


}




function die(){


if(gameOver)return;


gameOver=true;


createExplosion();

plane.x=-100;


setTimeout(()=>{


ctx.fillStyle="white";

ctx.font="35px Arial";


ctx.fillText(
"💥 KRASCH!",
110,
300
);


},1000);


}




function restart(){

start();

update();

}



start();

update();


</script>

</body>
</html>
