<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Matte Runner Del 2</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    color:#00ff99;
}

#info{
    font-size:22px;
}

#game{
    width:420px;
    height:600px;
    margin:auto;
    background:linear-gradient(#55c9ff,#2277dd);
    border:5px solid white;
    position:relative;
    overflow:hidden;
}


#player{
    width:50px;
    height:50px;
    background:#ffcc00;
    border-radius:50%;
    position:absolute;
    bottom:40px;
    left:185px;
}


.answer{
    width:110px;
    height:70px;
    background:white;
    color:black;
    position:absolute;
    bottom:150px;
    font-size:30px;
    line-height:70px;
    border-radius:15px;
}


#answer1{
    left:20px;
}

#answer2{
    left:155px;
}

#answer3{
    left:290px;
}


#message{
    height:40px;
    font-size:25px;
}


button{
    padding:12px;
    font-size:20px;
}

</style>

</head>

<body>

<h1>🏃 Matte Runner</h1>

<div id="info">
❤️ <span id="lives">❤️❤️❤️</span>
<br>
⭐ Poäng: <span id="score">0</span>
</div>


<h2 id="question"></h2>


<div id="game">

<div id="player"></div>

<div class="answer" id="answer1"></div>
<div class="answer" id="answer2"></div>
<div class="answer" id="answer3"></div>

</div>


<div id="message"></div>

<button onclick="restart()">🔄 Starta om</button>


<script>

let score=0;
let lives=3;
let correctAnswer=0;


// skapa mattefråga

function newQuestion(){

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;

let type=Math.floor(Math.random()*4);


if(type==0){
    correctAnswer=a*b;
    question.innerHTML=
    a+" × "+b+" = ?";
}


if(type==1){
    correctAnswer=a+b;
    question.innerHTML=
    a+" + "+b+" = ?";
}


if(type==2){

    if(a<b){
        let temp=a;
        a=b;
        b=temp;
    }

    correctAnswer=a-b;

    question.innerHTML=
    a+" - "+b+" = ?";
}


if(type==3){

    correctAnswer=a*b;

    question.innerHTML=
    correctAnswer+" ÷ "+a+" = ?";
    correctAnswer=b;
}



let answers=[
correctAnswer,
correctAnswer+randomNumber(),
correctAnswer-randomNumber()
];


answers.sort(()=>Math.random()-0.5);


answer1.innerHTML=answers[0];
answer2.innerHTML=answers[1];
answer3.innerHTML=answers[2];

}



function randomNumber(){

return Math.floor(Math.random()*10)+1;

}



function move(place){

let positions=[
20,
155,
290
];


player.style.left=positions[place]+"px";


let chosen;


if(place==0)
chosen=answer1.innerHTML;

if(place==1)
chosen=answer2.innerHTML;

if(place==2)
chosen=answer3.innerHTML;



if(Number(chosen)==correctAnswer){

score+=10;

message.innerHTML="✅ Rätt! +10 poäng";
message.style.color="lime";

}

else{

lives--;

message.innerHTML=
"❌ Fel! Rätt svar var: "+correctAnswer;

message.style.color="red";


updateLives();


if(lives<=0){

message.innerHTML=
"💀 Game Over! Poäng: "+score;

}

}


scoreDisplay();

if(lives>0)
newQuestion();

}




function updateLives(){

let text="";

for(let i=0;i<lives;i++){
    text+="❤️";
}

livesDisplay.innerHTML=text;

}



function scoreDisplay(){

scoreDisplay2.innerHTML=score;

}



function restart(){

score=0;
lives=3;

updateLives();

scoreDisplay();

message.innerHTML="";

newQuestion();

}


// kopplingar

let question=document.getElementById("question");
let answer1=document.getElementById("answer1");
let answer2=document.getElementById("answer2");
let answer3=document.getElementById("answer3");

let player=document.getElementById("player");

let message=document.getElementById("message");

let livesDisplay=document.getElementById("lives");

let scoreDisplay2=document.getElementById("score");



document.addEventListener("keydown",function(e){

if(lives<=0)return;


if(e.key=="ArrowLeft")
move(0);


if(e.key=="ArrowDown")
move(1);


if(e.key=="ArrowRight")
move(2);


});


newQuestion();

</script>

</body>
</html>
